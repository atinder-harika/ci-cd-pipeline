name: frontend-ci # Give it a descriptive name

on: # When should this run?
  push:
    branches: [main,development]
  pull_request:
    branches: [main,development]

jobs:
  test-and-build:
    runs-on: ${{ matrix.os }} # Which OS?
    strategy:
      fail-fast: true  # Whether to cancel other jobs if one fails
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest] # Which OSes?
        node-version: [18, 20, 22]
        exclude:
        - os: macos-latest
          node-version: 18  # Skip macOS + Node 18
          exclude:
        - os: macos-latest
          node-version: 20  # Skip macOS + Node 20
        # include:
        #   - os: macos-latest
        #     node-version: 22  #(would use to include specific combinations)  
    
    defaults:
      run:
        working-directory: frontend # Where is your frontend code?
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Which action?
      
      - name: Setup Node.js with multiple versions
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }} # Which Node version?
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json # Where is your lock file?
      

      - name: Install dependencies
        run: npm ci # What command?
      
      - name: Run tests
        run: npm test # What command?
      
      - name: Build project
        run: npm run build # What command?