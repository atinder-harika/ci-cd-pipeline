name: frontend-ci # Give it a descriptive name

on: # When should this run?
  push:
    branches: [main,development]
  pull_request:
    branches: [main,development]

jobs:
  test-and-build:
    runs-on: ubuntu-latest # Which OS?
    
    defaults:
      run:
        working-directory: frontend # Where is your frontend code?
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Which action?
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json # Where is your lock file?
      
      # - name: Cache dependencies # Alternative Caching Approach
      #   uses: actions/cache@v4
      #   with:    
      #     path: frontend/node_modules
      #     key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
      #     restore-keys: |
      #       ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci # What command?
      
      - name: Run tests
        run: npm test # What command?
      
      - name: Build project
        run: npm run build # What command?